[project]
name = "questlog"
version = "0.1.0"
description = "Generate infinite, trackable skill trees in Markdown. No login, no bloat."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "google-generativeai>=0.3.0",
    "requests>=2.31.0",
]

[project.scripts]
questlog = "questlog.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
